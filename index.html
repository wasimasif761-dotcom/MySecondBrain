<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta property="og:title" content="MySecondBrain" />

    <meta name="theme-color" content="#070913" />
    <meta name="mobile-web-app-capable" content="yes" />

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
